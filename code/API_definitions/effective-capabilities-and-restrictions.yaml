openapi: 3.0.3
info:
  title: Effective Capabilities and Restrictions 1.1.0-v3
  description: |
    The Effective Capabilities and Restrictions API lets an API Consumer
    discover, before invocation, the effective capability set that a producer
    supports for one or more released CAMARA APIs — either as static,
    producer-wide constraints or as runtime constraints derived from a specific
    end-user device context.

    ## Definitions

    **Capability**: the set of features, operations, parameters, and value
    ranges that the producer effectively supports for a given API and context.
    Analogous to `supportedFeatures` in 3GPP TS 29.571 — where a feature is
    considered supported if and only if it falls within the declared capability
    set — the effective capability set here is derived by starting from the
    full CAMARA API specification (representing the universe of possible
    features) and subtracting the restrictions enumerated in the returned
    overlay. An element of the CAMARA spec not referenced by any action in
    the overlay is therefore within the producer's capability set and is
    supported with its unmodified, CAMARA-defined semantics.

    **Restriction**: a narrowing of the CAMARA API contract that explicitly
    places a feature or value range *outside* the producer's capability set
    for the given context. Analogous to a cleared bit in a `supportedFeatures`
    bitmap, a restriction is a precise, positive signal of non-support —
    not an inference. Restrictions fall into two categories:

    - *Static* (producer-wide): apply regardless of which device is queried,
      reflecting a deployment policy or network-wide capability boundary.
      Analogous to network-level `supportedFeatures` declared by the serving
      node independently of any individual UE.
    - *Runtime* (device-context): additionally conditioned on a specific
      end-user device's footprint, subscription tier, or current network
      attachment. Analogous to per-UE `supportedFeatures` negotiated at
      session or subscription establishment.

    The overlay therefore functions as an **inverse capability declaration**:
    rather than enumerating what the producer supports (as a `supportedFeatures`
    bitmap would), it enumerates only the deviations from full support. This
    inversion is intentional — most features are supported; only the exceptions
    require enumeration, keeping the overlay compact. The effective capability
    set is the complement: everything the CAMARA spec defines that the overlay
    does not restrict.

    The producer returns, per requested CAMARA API, a `RestrictiveOverlay`
    document that the consumer applies locally to the corresponding CAMARA
    API specification to obtain a strictly-valid, narrowed view representing
    the producer's effective capability set for that context.

    > **Note on Overlay versioning**: this API targets Overlay Specification
    > **version 1.1.0**. Returned overlay documents carry `overlay: "1.1.0"`
    > in their root field, enforced structurally by `RestrictiveOverlay`
    > (see `components/schemas/RestrictiveOverlay`). Consumers MUST NOT assume
    > that [`https://spec.openapis.org/overlay/latest.html`](https://spec.openapis.org/overlay/latest.html)
    > resolves to 1.1.0 — that URL tracks the upstream release train. Adoption
    > of a newer Overlay version would be a breaking change requiring a new API
    > version.

    # Restriction-only semantics

    Producers MUST emit only restrictive `actions[]` in every overlay returned
    by this API. An action is restrictive when it either:

    - sets `remove: true` to delete an existing node from the target document, or
    - sets `update: { ... }` whose top-level keys narrow the target node using
      JSON Schema validation keywords — for example, an `enum` that is a strict
      subset of the existing enum, a lowered `maximum`/`maxLength`/`maxItems`,
      a raised `minimum`/`minLength`/`minItems`, a tightened `pattern`, a
      `uniqueItems: true` constraint, or a `required` array that adds
      previously-optional properties.

    **Structural enforcement**: restriction-only semantics are enforced at the
    schema level by the `RestrictiveAction` and `SchemaRestrictions` schemas,
    not only by prose contract:

    - `RestrictiveAction` uses `additionalProperties: false` to structurally
      forbid the `copy` action introduced in Overlay 1.1.0. A well-formed
      response document cannot carry `copy` — any such document fails schema
      validation before reaching a consumer.
    - The `update` field in `RestrictiveAction` is typed as a map whose values
      must conform to `SchemaRestrictions`. The `SchemaRestrictions` vocabulary
      is a closed set of narrowing-only keywords. Widening operations — adding
      paths or operations, removing `required` entries, broadening enums —
      have no representation in this vocabulary and therefore cannot appear in
      a valid `update`.
    - `remove` is constrained to `enum: [true]` — only structural removal is
      expressible; `remove: false` (a no-op) is rejected.
    - `oneOf: [required: [remove], required: [update]]` on `RestrictiveAction`
      enforces that exactly one mutating field is present per action; an action
      with both or neither fails validation.

    Each `RestrictiveAction` MUST carry exactly one of `remove: true` or
    `update`. Co-presence of both, or presence of neither, fails schema
    validation (`oneOf` constraint on `RestrictiveAction`). Unlike raw
    Overlay 1.1.0 — which allows co-presence and resolves it by precedence —
    this API treats co-presence as a producer error, not a tie-break.

    Consumers MUST reject any overlay whose actions broaden the target
    document — for example, actions that add new operations, widen an `enum`,
    introduce new `oneOf` branches, raise a `maximum`, lower a `required`
    array, or otherwise relax the contract of the underlying CAMARA API.

    # Operation model

    The single operation `POST /retrieve-effective-overlay` accepts a list of
    CAMARA API specification URLs (released GitHub versions) and a `device`
    context. The returned overlay for each API reflects the **union of static
    and runtime restrictions**: static restrictions are producer-wide and apply
    regardless of the device supplied; runtime restrictions are additionally
    conditioned on the device's footprint, subscription tier, or network
    attachment. Consumers MUST NOT assume that all restrictions in a returned
    overlay are device-specific — a restriction present regardless of which
    device is queried is a static, producer-wide constraint on the capability
    set.

    The operation has two delivery modes selected by whether the request
    carries a `sink`:

    - **Synchronous** (no `sink`/`sinkCredential`): the producer evaluates the
      request and returns `200 OK` with an array of `RestrictiveOverlay`
      documents — valid Overlay 1.1.0 documents restricted to narrowing-only
      actions — one per requested API, in the same order as the request's
      `apis[]`.
    - **Asynchronous (implicit subscription)** (`sink` and `sinkCredential`
      both present): the producer returns `202 Accepted` immediately with an
      echo of the registered `sink` (never the credential), and delivers each
      computed overlay later via the sink as a single non-batch CloudEvent of
      type
      `org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated`,
      one CloudEvent per requested API. Subsequent producer-side state changes
      (for example, the device moves to a new footprint) result in additional
      CloudEvents of the same type carrying the updated overlay for the
      affected API.

    # End-to-end flow at a glance

    ```text
       App Backend          ECR Producer            Upstream CAMARA
       (Consumer)           (this API)              API (e.g. QoD)
            |                     |                        |
            | (a) [dev-time, one-time] developer or        |
            |     build pipeline fetches the upstream      |
            |     CAMARA spec (e.g. QoD r3.2) and          |
            |     bundles/ships it with the app            |
            |--------------------------------------------->|
            |<---------------------------------------------|
            |                     |                        |
            |    = = = = = = = = = = = = = = = = = =       |
            |             runtime (per device)             |
            |                     |                        |
            | (b) POST /retrieve-effective-overlay         |
            |     { apis:[<qod-url>], device:{...} }       |
            |-------------------->|                        |
            |                     | resolve (device, api): |
            |                     |  producer policy +     |
            |                     |  device footprint      |
            | (c) 200 OK          |                        |
            |     [{ overlay:"1.1.0",                      |
            |        extends:"<qod-url>",                  |
            |        actions:[ remove,                     |
            |                  update{enum},               |
            |                  update{maximum}, ... ] }]   |
            |<--------------------|                        |
            |                     |                        |
            | (d) apply overlay locally to cached spec     |
            |     => effective contract for THIS device    |
            |                     |                        |
            | (e) drive UI; pre-validate request bodies    |
            |     against the effective contract           |
            |                     |                        |
            | (f) POST upstream call (e.g. /sessions),     |
            |     pre-validated vs. the narrowed schema    |
            |--------------------------------------------->|
            |<---------------------------------------------|
            |     200/201 -- no surprise 422s              |
    ```

    Async variant: if the request body also carries `sink` and
    `sinkCredential`, step (c) becomes `202 Accepted` (echoing only the
    `sink`) and the producer later POSTs `overlay-updated` CloudEvents to
    the sink — once on the initial evaluation and once on each subsequent
    effective-view change. The consumer replaces its cached overlay for
    `data.api` and re-applies, then re-renders step (e) without
    re-mounting the form.

    # Recovery

    Notification delivery is at-most-once. To recover from a missed
    notification, a consumer simply re-issues the original
    `POST /retrieve-effective-overlay` request: the operation is idempotent
    and the response always reflects the producer's current effective view for
    the supplied context. There is no bitmap, no `mappingVersion`, no resync
    state machine.

    # Authorization and authentication

    The "Authorization and authentication" common guidelines, defined in
    [Commonalities](https://github.com/camaraproject/Commonalities/blob/main/documentation/CAMARA-API-access-and-user-consent.md),
    apply to this API. The API uses OpenID Connect (OIDC) authentication, and
    grant management via CIBA. The required scope for the
    `retrieveEffectiveOverlay` operation is
    `effective-capabilities-and-restrictions:retrieve-effective-overlay`, which
    grants the right to retrieve the effective overlay for a given device.
    Callback (`sink`) authentication is conveyed out-of-band by the
    `sinkCredential` supplied with the request; the credential itself is never
    echoed in any response.

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive.
    Therefore the API specification may not document some non-mandatory error
    statuses such as 504 (Gateway Timeout) introduced by Commonalities.
    Consumers MUST be prepared to handle other error responses than those
    listed here. Where appropriate, error responses follow the standard
    CAMARA error structure defined in `CAMARA_common.yaml`.


# Hand-authored YAML module defining the SchemaRestrictions narrowing-only
# vocabulary used by CAMARA APIs that enforce restriction-only overlay
# semantics (see effective-capabilities-and-restrictions).
#
# Any change to this file MUST bump info.version: MINOR for an addition or a
# relaxation that keeps every previously valid restriction valid (for example
# a new restriction subtype), MAJOR for a change that invalidates previously
# valid restrictions or redefines a subtype's semantics. Consuming APIs inline
# this module when they are bundled for release, so a published API keeps the
# vocabulary version it was released with; a consuming API adopts a newer
# version in its next release and bumps its own version.
#
# SCOPE: this file is Overlay-version-agnostic. The vocabulary describes what
# may appear in the `update` field of a restrictive action regardless of
# whether the surrounding overlay document conforms to Overlay 1.0.0, 1.1.0,
# or a future version. Overlay-version-specific constraints (pinning the
# `overlay` field value, forbidding `copy`) are the responsibility of the
# consuming API's local RestrictiveAction and RestrictiveOverlay schemas.
#
# This file MUST NOT be modified to encode API-specific semantics. It is a
# shared vocabulary module.
openapi: 3.0.3
info:
  title: CAMARA Schema Restrictions Vocabulary 2.1.0
  description: |
    Defines the closed, narrowing-only vocabulary for the `update` field of
    a CAMARA restrictive overlay action. Every validation restriction in this
    vocabulary reduces the set of valid instances of the target node. Annotation
    restrictions do not widen the target schema and MUST NOT contradict the
    original target schema.

    ## Entry point

    Consuming APIs reference `SchemaRestrictions` as the value type for
    `RestrictiveAction.update.additionalProperties`. `SchemaRestrictions`
    composes one or more `SchemaRestriction` objects via a logical operator
    (`and`, `or`, or `not`). Each `SchemaRestriction` resolves via `oneOf`
    (disambiguated by its required `kind` discriminator) to exactly one of
    the nine typed subschemas below.

    ## Restriction subtypes

    | Schema | `kind` value | Applies to | Keywords |
    |---|---|---|---|
    | `SchemaRestrictionAnnotation` | `SchemaRestrictionAnnotation` | any node | deprecated, readOnly, writeOnly, default |
    | `SchemaRestrictionAnyInstance` | `SchemaRestrictionAnyInstance` | any node | type, enum (values admitted by the target; strict subset of an existing enum), const |
    | `SchemaRestrictionNumeric` | `SchemaRestrictionNumeric` | number/integer | maximum, minimum, exclusiveMaximum, exclusiveMinimum, multipleOf |
    | `SchemaRestrictionString` | `SchemaRestrictionString` | string | maxLength, minLength, pattern |
    | `SchemaRestrictionArray` | `SchemaRestrictionArray` | array | maxItems, minItems, uniqueItems (true only), maxContains, minContains |
    | `SchemaRestrictionObject` | `SchemaRestrictionObject` | object | maxProperties, minProperties, required (add-only), dependentRequired, excludedProperties |
    | `SchemaRestrictionParameter` | `SchemaRestrictionParameter` | OAS Parameter Object | allowEmptyValue, mandatory (true only) |
    | `SchemaRestrictionOperation` | `SchemaRestrictionOperation` | OAS Operation Object | notImplemented (true only), notAvailable (true only) |
    | `SchemaRestrictionInstancePresence` | `SchemaRestrictionInstancePresence` | any node | presence (true = must exist, false = must be absent) |

    ## Versioning

    The vocabulary version is `info.version`; the file name
    (`schema-restrictions.yaml`) is unversioned. Every change MUST bump
    `info.version`:

    - MINOR for an addition or relaxation that keeps every previously valid
      restriction valid, such as a new restriction subtype;
    - MAJOR for a change that invalidates previously valid restrictions or
      redefines a subtype's semantics.

    Consuming APIs reference this file by name and inline it when they are
    bundled for release, so a published API keeps the vocabulary version it
    was released with and never silently inherits a later change. A
    consuming API adopts a newer vocabulary version in its next release and
    bumps its own version.

  version: 2.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths: {}

components:
  schemas:

    SchemaRestrictions:
      description: |
        A named set of one or more narrowing restrictions applied to a single
        target node in the OpenAPI document, combined with a logical `operator`.
        Each entry in `restrictions` MUST narrow the target on its own: an entry
        that would widen the target schema, depend on another entry to become
        valid, or admit a value the original target schema does not admit MUST
        be rejected.

        `operator` — logical combinator:
        - `and` combines valid restrictions by intersection.
        - `or` combines valid restrictions by union. Because every entry is
          independently subset-preserving relative to the same target node, the
          union remains subset-preserving.
        - `not` negates a single restriction result. It MUST be evaluated only where
          the validator can prove that the negated result is subset-preserving
          relative to the same target node; otherwise it MUST be rejected.
      type: object
      additionalProperties: false
      required: [restrictions]
      properties:
        targetKind:
          description: |
            Optional expected kind of the target node selected by the enclosing
            overlay action. When present, validators MUST verify that the resolved
            target node has this kind before applying the restriction set.
          type: string
          enum:
            - schema
            - schemaProperty
            - parameter
            - operation
            - pathItem
        restrictions:
          description: One or more SchemaRestriction objects to evaluate against the target.
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SchemaRestriction"
        operator:
          description: |
            Logical operator combining restriction results.
            `and` — all MUST be true (default).
            `or`  — at least one MUST be true.
            `not` — negates the single restriction result. The `restrictions` array MUST contain
            exactly one item. Validators MUST enforce this rule semantically.
          type: string
          enum: [and, or, not]
          default: and

    SchemaRestriction:
      description: |
        A single narrowing constraint applied to the selected target node.
        MUST match exactly one of the nine typed subschemas (oneOf),
        disambiguated by the required `kind` discriminator property — every
        subtype requires `kind` to be present and set to its own schema name.
        An empty object `{}` is not a valid SchemaRestriction — every subtype
        requires at least `kind` plus one restriction property
        (minProperties: 2, which `kind` alone does not satisfy since `kind`
        is required in addition to it).
        MUST NOT widen the schema — for example, MUST NOT raise a `maximum`,
        lower a `minimum`, add enum values, or remove `required` entries.
      type: object
      discriminator:
        propertyName: kind
        mapping:
          SchemaRestrictionAnnotation: '#/components/schemas/SchemaRestrictionAnnotation'
          SchemaRestrictionAnyInstance: '#/components/schemas/SchemaRestrictionAnyInstance'
          SchemaRestrictionNumeric: '#/components/schemas/SchemaRestrictionNumeric'
          SchemaRestrictionString: '#/components/schemas/SchemaRestrictionString'
          SchemaRestrictionArray: '#/components/schemas/SchemaRestrictionArray'
          SchemaRestrictionObject: '#/components/schemas/SchemaRestrictionObject'
          SchemaRestrictionParameter: '#/components/schemas/SchemaRestrictionParameter'
          SchemaRestrictionOperation: '#/components/schemas/SchemaRestrictionOperation'
          SchemaRestrictionInstancePresence: '#/components/schemas/SchemaRestrictionInstancePresence'
      oneOf:
        - $ref: "#/components/schemas/SchemaRestrictionAnnotation"
        - $ref: "#/components/schemas/SchemaRestrictionAnyInstance"
        - $ref: "#/components/schemas/SchemaRestrictionNumeric"
        - $ref: "#/components/schemas/SchemaRestrictionString"
        - $ref: "#/components/schemas/SchemaRestrictionArray"
        - $ref: "#/components/schemas/SchemaRestrictionObject"
        - $ref: "#/components/schemas/SchemaRestrictionParameter"
        - $ref: "#/components/schemas/SchemaRestrictionOperation"
        - $ref: "#/components/schemas/SchemaRestrictionInstancePresence"

    SchemaRestrictionAnnotation:
      description: |
        Annotation-level restrictions applicable to any target node at runtime.
        Based on the JSON Schema
        [A Vocabulary for Basic Meta-Data Annotations](https://www.ietf.org/archive/id/draft-bhutton-json-schema-validation-01.html#name-a-vocabulary-for-basic-meta).
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionAnnotation]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionAnnotation.
        deprecated:
          type: boolean
          description: |
            Mark the target node as deprecated. Only `true` is a restriction option.
            A restriction cannot un-deprecate a property.
          enum: [ true ]
        readOnly:
          type: boolean
          description: |
            Mark the target node as read-only. Only `true` is a restriction option.
            A restriction cannot make a read-only property writable.
          enum: [ true ]
        writeOnly:
          type: boolean
          description: |
            Mark the target node as write-only. Only `true` is a restriction option.
            A restriction cannot make a write-only property readable.
          enum: [ true ]
        default:
          description: |
            Default value to apply to the target node. This is an annotation,
            not a validation constraint. The value MUST be valid against the
            original target schema.
          anyOf:
            - type: string
              maxLength: 1024
            - type: number
            - type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: boolean

    SchemaRestrictionAnyInstance:
      description: |
        Type, enum, and const restrictions applicable to any target instance
        at runtime. Based on the JSON Schema
        [Validation keywords for Any instances](https://www.ietf.org/archive/id/draft-bhutton-json-schema-validation-01.html#name-validation-keywords-for-any).
        Each `enum` value MUST be valid against the original target schema. If
        the original target schema defines `enum`, the restricted `enum` MUST
        be a strict subset of it. A restriction that would leave no allowed
        value cannot be expressed with `enum` (`minItems: 1`); express it with
        an operation-level restriction instead.
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionAnyInstance]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionAnyInstance.
        type:
          type: string
          enum: [boolean, object, array, number, string, integer]
          description: |
            Restrict the type of the value. Only applicable when the type was
            not initially specified or matches the target's current type.
        enum:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: |
            Restrict allowed values to this list. Each value MUST be valid
            against the original target schema; if that schema defines
            `enum`, this list MUST be a strict subset of it.
          items:
            description: A value that remains allowed for the target node; it MUST be valid against the original target schema.
            anyOf:
              - type: string
                maxLength: 256
              - type: number
              - type: integer
                format: int64
                minimum: -9007199254740991
                maximum: 9007199254740991
              - type: boolean
        const:
          anyOf:
            - type: string
              maxLength: 1024
            - type: number
            - type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: boolean
          description: Force the target field to a single constant value.

    SchemaRestrictionNumeric:
      description: |
        Narrowing constraints on numeric values. Based on the JSON Schema
        [Validation keywords for Numeric Instances](https://www.ietf.org/archive/id/draft-bhutton-json-schema-validation-01.html#name-validation-keywords-for-num).
        Applied values MUST narrow the effective range: `maximum` MUST be ≤
        the original maximum; `minimum` MUST be ≥ the original minimum.
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionNumeric]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionNumeric.
        multipleOf:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: New multipleOf must be an integer multiple of old multipleOf
        maximum:
          type: number
          description: Value MUST be ≤ this number. MUST be ≤ the original maximum.
        minimum:
          type: number
          description: Value MUST be ≥ this number. MUST be ≥ the original minimum.
        exclusiveMaximum:
          type: number
          description: Value MUST be strictly < this number.
        exclusiveMinimum:
          type: number
          description: Value MUST be strictly > this number.

    SchemaRestrictionString:
      description: |
        Narrowing constraints on string fields (length or pattern). Based on
        the JSON Schema
        [Validation keywords for Strings](https://www.ietf.org/archive/id/draft-bhutton-json-schema-validation-01.html#name-validation-keywords-for-str).
        Applied values MUST narrow the effective range: `maxLength` MUST be ≤
        the original; `minLength` MUST be ≥ the original.
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionString]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionString.
        maxLength:
          type: integer
          format: int32
          minimum: 0
          maximum: 4096
          description: Maximum string length. MUST be ≤ the original maxLength. The upper bound of this property (4096) is a limit of this vocabulary, not of the target schema.
        minLength:
          type: integer
          format: int32
          minimum: 0
          maximum: 4096
          description: Minimum string length. MUST be ≥ the original minLength. The upper bound of this property (4096) is a limit of this vocabulary, not of the target schema.
        pattern:
          type: string
          maxLength: 1024
          description: Regular-expression pattern the string MUST match (tightening only).

    SchemaRestrictionArray:
      description: |
        Narrowing constraints on array fields (size or uniqueness). Based on
        the JSON Schema
        [Validation keywords for Array Instances](https://www.ietf.org/archive/id/draft-bhutton-json-schema-validation-01.html#name-validation-keywords-for-arr).
        Applied values MUST narrow the effective range: `maxItems` MUST be ≤
        the original; `minItems` MUST be ≥ the original.
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionArray]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionArray.
        maxItems:
          type: integer
          format: int32
          minimum: 0
          maximum: 4096
          description: Maximum item count. MUST be ≤ the original maxItems. The upper bound of this property (4096) is a limit of this vocabulary, not of the target schema.
        minItems:
          type: integer
          format: int32
          minimum: 0
          maximum: 4096
          description: Minimum item count. MUST be ≥ the original minItems. The upper bound of this property (4096) is a limit of this vocabulary, not of the target schema.
        uniqueItems:
          type: boolean
          enum: [true]
          description: |
            When present, MUST be `true`. Enforces uniqueness on array items.
            Setting to `false` (relaxing uniqueness) is not permitted.
        maxContains:
          type: integer
          format: int32
          minimum: 0
          maximum: 4096
          description: Maximum count for items that match the `contains` schema. The upper bound of this property (4096) is a limit of this vocabulary, not of the target schema.
        minContains:
          type: integer
          format: int32
          minimum: 0
          maximum: 4096
          description: Minimum count for items that match the `contains` schema. The upper bound of this property (4096) is a limit of this vocabulary, not of the target schema.

    SchemaRestrictionObject:
      description: |
        Narrowing constraints on object structures. Based on the JSON Schema
        [Validation keywords for Object Instances](https://www.ietf.org/archive/id/draft-bhutton-json-schema-validation-01.html#name-validation-keywords-for-obj).
        `required` can only ADD entries that already exist in the original
        schema's `properties` — it cannot remove existing required entries.
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionObject]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionObject.
        maxProperties:
          type: integer
          format: int32
          minimum: 0
          maximum: 128
          description: Maximum property count. MUST be ≤ the original maxProperties. The upper bound of this property (128) is a limit of this vocabulary, not of the target schema.
        minProperties:
          type: integer
          format: int32
          minimum: 0
          maximum: 128
          description: Minimum property count. MUST be ≥ the original minProperties. The upper bound of this property (128) is a limit of this vocabulary, not of the target schema.
        required:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: |
            Properties that MUST be present in valid instances. Entries MUST
            already exist in the original schema's `properties`. This keyword
            can only ADD to the required set — it cannot remove existing
            required entries.
          items:
            type: string
            maxLength: 256
            description: Name of a property that becomes mandatory; it MUST already be defined in the original schema's properties.
        dependentRequired:
          type: object
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            description: |
              Additional properties that become required when another specified
              property is present. Each key is the triggering property. Each
              array value lists dependent properties that MUST also be present.
              Triggering and dependent properties MUST already exist in the
              original schema's properties. See
              [`dependentRequired`](https://json-schema.org/draft/2020-12/json-schema-validation#name-validation-keywords-for-obj).
            items:
              type: string
              maxLength: 256
              description: Name of a property that becomes mandatory whenever the triggering property is present.
        excludedProperties:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: Properties that MUST be absent from valid instances.
          items:
            type: string
            maxLength: 256
            description: Name of a property that MUST be absent from valid instances.

    SchemaRestrictionParameter:
      description: |
        Narrowing constraints specific to OpenAPI Parameter Objects (e.g.,
        query parameters). Based on the OpenAPI Parameter Object and provides
        the ability to mandate an otherwise-optional parameter.
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionParameter]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionParameter.
        allowEmptyValue:
          type: boolean
          enum: [ false ]
          description: |
            Disallows empty values for a query parameter. Only `false` is
            permitted because allowing empty values would be a relaxation, not
            a restriction. This restriction is only applicable to OpenAPI
            query parameters.
        mandatory:
          type: boolean
          enum: [true]
          description: |
            Mandates an otherwise-optional parameter. Only `true` is valid.
            MUST NOT be applied to a parameter already marked `deprecated: true`.

    SchemaRestrictionOperation:
      description: |
        Availability restrictions on OpenAPI Operation Objects. Marks an
        operation as temporarily unavailable or unimplemented. This is the
        mechanism to express "this operation is unavailable" via `update` —
        structural removal of the operation node uses `remove: true` on the
        enclosing RestrictiveAction.

        Exactly one of `notImplemented` and `notAvailable` MUST be present
        besides `kind`.
      type: object
      minProperties: 2
      maxProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionOperation]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionOperation.
        notImplemented:
          type: boolean
          enum: [true]
          description: |
            Marks the operation as unimplemented. Invocation MUST return
            501 Not Implemented. Only `true` is valid.
        notAvailable:
          type: boolean
          enum: [true]
          description: |
            Marks the operation as temporarily unavailable. Invocation MUST
            return 503 Service Unavailable. Only `true` is valid.

    SchemaRestrictionInstancePresence:
      description: |
        Restriction that applies to the instance runtime presence of the target node.
        `presence: true` mandates the node MUST exist (tightening);
        `presence: false` mandates it MUST be absent (tightening). Both
        directions are narrowing operations.
      type: object
      minProperties: 2
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [SchemaRestrictionInstancePresence]
          description: Discriminator tag identifying this restriction as a SchemaRestrictionInstancePresence.
        presence:
          type: boolean
          description: |
            When `true`, at least one instance matching the target MUST be present in the
            runtime request or response payload. When `false`, no such instance may be
            present.

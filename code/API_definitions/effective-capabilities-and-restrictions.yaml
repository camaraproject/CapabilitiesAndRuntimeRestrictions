  version: wip
  x-camara-commonalities: 0.8.0-rc.2

externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/

servers:
  - url: "{apiRoot}/effective-capabilities-and-restrictions/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: |
          API root, defined by the service provider, e.g.
          `api.example.com` or `api.example.com/somepath`.

tags:
  - name: Effective Overlay
    description: |
      Retrieve producer-specific effective overlay documents for one or more
      CAMARA APIs in the context of a given device. Optionally subscribe to
      overlay updates via an implicit `sink` callback.

security:
  - openId:
      - effective-capabilities-and-restrictions:retrieve-effective-overlay

paths:
  /retrieve-effective-overlay:
    post:
      tags:
        - Effective Overlay
      summary: Retrieve the effective overlay for one or more CAMARA APIs
      description: |
        Computes the producer-specific effective overlay for each CAMARA API
        listed in `apis[]`, in the context of the supplied `device`.

        - If neither `sink` nor `sinkCredential` is supplied, returns
          `200 OK` synchronously with an array of `RestrictiveOverlay`
          documents — valid Overlay 1.1.0 documents restricted to
          narrowing-only actions — one per entry in `apis[]`, in the same
          order as the request.
        - If both `sink` and `sinkCredential` are supplied, returns
          `202 Accepted` with no overlays in the body (the response echoes
          only the registered `sink`) and the producer subsequently delivers
          one CloudEvent of type
          `org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated`
          per requested API via the registered `sink`. Additional CloudEvents
          of the same type are delivered whenever the effective overlay for
          any of the requested APIs changes.

        The operation is idempotent: repeating the same request returns the
        same effective overlay set (or schedules the same async delivery) for
        a stable producer-side configuration. To recover from a missed
        notification, simply re-issue the request.
      operationId: retrieveEffectiveOverlay
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveEffectiveOverlayRequest"
      callbacks:
        overlayUpdated:
          "{$request.body#/sink}":
            post:
              summary: "overlay-updated notification callback"
              description: |
                Important: this endpoint is to be implemented by the API
                consumer. The Effective Capabilities and Restrictions producer
                POSTs to this endpoint once per affected CAMARA API whenever
                the effective overlay changes for the device-context of an
                active asynchronous request. Each notification is a single
                (non-batch) CloudEvent carrying a `RestrictiveOverlay` document
                in its `data.overlay` field.
              operationId: postOverlayUpdated
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/OverlayUpdatedEvent"
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Generic400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Generic401"
                "403":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Generic403"
                "410":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Generic410"
                "429":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Generic429"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        "200":
          description: |
            Synchronous response. The body is an array of `RestrictiveOverlay`
            documents — valid [OpenAPI Overlay 1.1.0](https://spec.openapis.org/overlay/v1.1.0.html)
            documents restricted to narrowing-only actions — one per entry in
            the request's `apis[]`, in the same order. Each document carries
            `overlay: "1.1.0"` in its root field, enforced by the
            `RestrictiveOverlay` schema. Returned only when the request omits
            both `sink` and `sinkCredential`.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 20
                description: |
                  One `RestrictiveOverlay` document per requested CAMARA API,
                  in the same order as the request's `apis[]`. Each document
                  carries `overlay: "1.1.0"` and contains only narrowing-only
                  actions enforced by the `RestrictiveAction` schema.
                items:
                  $ref: "#/components/schemas/RestrictiveOverlay"
        "202":
          description: |
            Asynchronous acceptance. Returned only when both `sink` and
            `sinkCredential` are present in the request. No overlays are
            included in the body; the producer will deliver one CloudEvent
            of type
            `org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated`
            per requested API to the registered `sink`. The body echoes only
            the registered `sink` so the consumer can confirm the value the
            producer captured. The `sinkCredential` is never echoed.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveEffectiveOverlayAccepted"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic404"
        "422":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic422"
        "429":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic429"
        "500":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic500"
        "503":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Generic503"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"

  schemas:

    # ─────────────────────────────────────────────────────────────────────────
    # Device (inline)
    #
    # Inlined per design contract: this API exposes `device` as its sole wire
    # context input. The shape mirrors the canonical CAMARA Device but is
    # declared locally with no $refs to ../common so the wire contract for
    # this API is fully self-contained.
    # ─────────────────────────────────────────────────────────────────────────

    Device:
      description: |
        End-user equipment able to connect to a mobile network. Examples
        include smartphones and IoT sensors/actuators.

        The API Consumer can provide one or more of the following identifiers
        and the API Producer will use one identifier of its choice for the
        producer-side policy evaluation:
          - `phoneNumber`
          - `networkAccessIdentifier`
          - `ipv4Address`
          - `ipv6Address`

        At least one identifier MUST be present.
      type: object
      minProperties: 1
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{4,14}$'
          maxLength: 16
          description: |
            A public identifier addressing a telephone subscription. In mobile
            networks it corresponds to the MSISDN, formatted in international
            E.164 form prefixed with `+`.
          example: "+123456789"
        networkAccessIdentifier:
          type: string
          maxLength: 2048
          description: |
            A public identifier addressing a subscription in a mobile network.
            In 3GPP terminology, it corresponds to the GPSI formatted with the
            External Identifier (`{Local Identifier}@{Domain Identifier}`).
          example: "123456789@example.com"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Address"
        ipv6Address:
          type: string
          format: ipv6
          maxLength: 45
          description: |
            The device should be identified by the observed IPv6 address, or
            by any single IPv6 address from within the subnet allocated to the
            device.
          example: "2001:db8:85a3:8d3:1319:8a2e:370:7344"

    DeviceIpv4Address:
      description: |
        The device IPv4 identification. `publicAddress` MUST always be present;
        in addition, at least one of `privateAddress` or `publicPort` MUST be
        present so the device can be uniquely identified through NAT.
      type: object
      properties:
        publicAddress:
          type: string
          format: ipv4
          maxLength: 15
          description: A single public (observed) IPv4 address.
          example: "84.125.93.10"
        privateAddress:
          type: string
          format: ipv4
          maxLength: 15
          description: A single private (allocated) IPv4 address.
          example: "10.0.0.5"
        publicPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: TCP or UDP source port observed at the application server.
          example: 59765
      anyOf:
        - required: [publicAddress, privateAddress]
        - required: [publicAddress, publicPort]

    # ─────────────────────────────────────────────────────────────────────────
    # Request body
    # ─────────────────────────────────────────────────────────────────────────

    RetrieveEffectiveOverlayRequest:
      description: |
        Request body for `POST /retrieve-effective-overlay`. Carries the list
        of CAMARA APIs to evaluate, the device context, and (optionally) an
        implicit-subscription `sink` + `sinkCredential` pair selecting
        asynchronous delivery.

        Either both `sink` and `sinkCredential` are present (asynchronous
        mode, `202` response) or neither is present (synchronous mode,
        `200` response).
      type: object
      required:
        - apis
      properties:
        apis:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: |
            One or more URLs identifying released GitHub versions of CAMARA
            API specifications for which the producer's effective overlay is
            requested. The producer returns one overlay per entry, in the
            same order.
          items:
            type: string
            format: uri
            maxLength: 2048
            description: |
              URL of a released version of a CAMARA API specification on
              GitHub, e.g.
              `https://github.com/camaraproject/QualityOnDemand/blob/r2.2/code/API_definitions/quality-on-demand.yaml`.
            example: "https://github.com/camaraproject/QualityOnDemand/blob/r2.2/code/API_definitions/quality-on-demand.yaml"
        device:
          $ref: "#/components/schemas/Device"
        sink:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://.+$'
          description: |
            HTTPS URL at which the API Consumer is willing to receive
            `overlay-updated` CloudEvents. Presence of this property (together
            with `sinkCredential`) selects the asynchronous delivery mode and
            implicitly subscribes the consumer to overlay updates for the
            requested APIs.
          example: "https://consumer.example.com/effective-overlay/notifications"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"

    # ─────────────────────────────────────────────────────────────────────────
    # Accepted response (async mode)
    #
    # Echoes only the registered `sink` so the consumer can confirm the value
    # the producer captured. The `sinkCredential` is never echoed.
    # ─────────────────────────────────────────────────────────────────────────

    RetrieveEffectiveOverlayAccepted:
      description: |
        Acknowledges acceptance of an asynchronous request. Echoes only the
        registered `sink`; overlays are delivered later via CloudEvents and
        are not part of this response.
      type: object
      required:
        - sink
      properties:
        sink:
          type: string
          format: uri
          maxLength: 2048
          description: |
            The HTTPS sink URL the producer has registered for this request.
            Echoed verbatim from the request body for consumer confirmation.
          example: "https://consumer.example.com/effective-overlay/notifications"

    # ─────────────────────────────────────────────────────────────────────────
    # SchemaRestrictions vocabulary — defined in shared module
    #
    # All SchemaRestriction* schemas live in the version-pinned module:
    #   ../modules/schema-restrictions.yaml
    #
    # This API references only the root entry point (SchemaRestrictions) via
    # RestrictiveAction.update.additionalProperties. The full vocabulary
    # (SchemaRestriction, SchemaRestrictionAnnotation, SchemaRestrictionAnyInstance,
    # SchemaRestrictionNumeric, SchemaRestrictionString, SchemaRestrictionArray,
    # SchemaRestrictionObject, SchemaRestrictionParameter,
    # SchemaRestrictionOperation, SchemaRestrictionInstancePresence) is defined and
    # documented there. The bundled release artifact inlines all $refs, so
    # consumers always receive a self-contained document.
    #
    # SchemaRestriction uses oneOf (not anyOf)
    # and each subtype adds minProperties: 1, preventing empty-object matches.
    # To adopt a newer vocabulary version, update the $ref below and bump
    # this API's version field.
    # ─────────────────────────────────────────────────────────────────────────

    # ─────────────────────────────────────────────────────────────────────────
    # Restrictive Overlay structure
    #
    # RestrictiveAction and RestrictiveOverlay define the wire format for
    # overlay documents returned by this API. RestrictiveOverlay is a CAMARA
    # profile of Overlay 1.1.0: it carries overlay: "1.1.0", extends, and
    # actions, but is not executable by a stock Overlay processor because
    # update values are typed through the SchemaRestrictions vocabulary
    # defined in ../modules/schema-restrictions.yaml.
    # ─────────────────────────────────────────────────────────────────────────

    RestrictiveAction:
      description: |
        A CAMARA profile of an Overlay 1.1.0 Action Object, restricted to narrowing-only operations.

        Structural constraints enforced by this schema:

        - `additionalProperties: false` — structurally forbids the `copy` action
          introduced in Overlay 1.1.0. Any overlay document carrying `copy` on an
          action fails schema validation before reaching a consumer.
        - `update` is typed as a map of `SchemaRestrictions` — a closed vocabulary
          of narrowing-only keywords. Widening operations (adding paths, removing
          required entries, broadening enums) have no representation in this
          vocabulary and therefore cannot appear in a valid `update`.
        - `remove` is constrained to `enum: [true]` — only structural removal is
          expressible; `remove: false` (a no-op) is rejected.
        - `oneOf: [required: [remove], required: [update]]` — exactly one
          mutating field MUST be present per action; an action with both or
          neither fails validation.
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            A JSONPath expression selecting one or more nodes in the target
            OpenAPI document to which this action applies. MUST conform to the
            JSONPath syntax defined by Overlay 1.1.0.
          example: "$.components.schemas['Device'].properties['ipv4Address']"
        remove:
          type: boolean
          enum: [true]
          description: |
            When present (and MUST be `true`), the selected node is removed
            from the target document. Removing a node is always a narrowing
            operation. `remove: false` is not permitted.
        update:
          type: object
          description: |
            A map of named restriction sets to apply to the selected node.
            Every value MUST conform to `SchemaRestrictions`. Only narrowing
            keywords are expressible — widening operations have no
            representation in the `SchemaRestrictions` vocabulary.
          minProperties: 1
          additionalProperties:
            $ref: "../modules/schema-restrictions.yaml#/components/schemas/SchemaRestrictions"
      oneOf:
        - required: [remove]
        - required: [update]

    RestrictiveOverlay:
      description: |
        A CAMARA profile of OpenAPI Overlay 1.1.0. Reuses the Overlay 1.1.0
        document structure and JSONPath targeting — the `overlay` field is
        pinned to `"1.1.0"`, `extends` identifies the target CAMARA API
        specification, and `actions` lists the producer-specific narrowings in
        application order — but is not executable by a stock Overlay 1.1.0
        processor because `update` values are interpreted through the CAMARA
        `SchemaRestrictions` vocabulary, which is outside the Overlay 1.1.0
        specification.

        Structural constraints:

        - `additionalProperties: false` eliminates `copy` and any undocumented
          Overlay fields from valid documents.
        - `overlay: enum: ["1.1.0"]` — the version is pinned at the schema level,
          preventing silent adoption of a newer Overlay version whose semantics
          have not been reviewed for restriction-only compatibility.
        - All `actions` items MUST conform to `RestrictiveAction`, which enforces
          the closed `SchemaRestrictions` vocabulary on `update` and forbids `copy`
          structurally.

        Any element of the target CAMARA API specification not referenced by an
        `action.target` is supported by the producer with unmodified semantics.
        The overlay enumerates only producer-specific narrowings; consumers infer
        capabilities from what the overlay leaves untouched.
      type: object
      required: [overlay, extends, actions]
      additionalProperties: false
      properties:
        overlay:
          type: string
          enum: ["1.1.0"]
          maxLength: 10
          description: |
            Overlay specification version. MUST be `"1.1.0"`. Pinned at the
            schema level to prevent silent adoption of a newer Overlay version
            whose semantics have not been reviewed for restriction-only
            compatibility.
        info:
          type: object
          description: Optional metadata about this overlay document.
          additionalProperties: false
          properties:
            title:
              type: string
              maxLength: 256
              description: Human-readable title of the overlay document.
            version:
              type: string
              maxLength: 64
              description: Version of this overlay document.
        extends:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL of the CAMARA API specification this overlay targets. Matches
            one of the entries in the original request's `apis[]`.
          example: "https://github.com/camaraproject/QualityOnDemand/blob/r2.2/code/API_definitions/quality-on-demand.yaml"
        actions:
          type: array
          description: |
            Ordered list of narrowing-only actions to apply to the target
            document. Applied in order; later actions may reference nodes
            modified by earlier actions. All items MUST conform to
            `RestrictiveAction`.
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/RestrictiveAction"

    # ─────────────────────────────────────────────────────────────────────────
    # CloudEvent notification
    # ─────────────────────────────────────────────────────────────────────────

    OverlayUpdatedEventType:
      type: string
      description: |
        The single CloudEvent type emitted by this API. One CloudEvent is
        delivered per affected CAMARA API.
      enum:
        - org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated

    OverlayUpdatedEventData:
      description: |
        Payload of an `overlay-updated` CloudEvent. Identifies the CAMARA API
        whose effective overlay has changed and carries the full replacement
        `RestrictiveOverlay` document. Consumers replace any prior overlay for
        `api` with `overlay`.
      type: object
      required:
        - api
        - overlay
      properties:
        api:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL of the CAMARA API specification whose effective overlay has
            changed. Matches one of the entries in the original request's
            `apis[]`.
          example: "https://github.com/camaraproject/QualityOnDemand/blob/r2.2/code/API_definitions/quality-on-demand.yaml"
        overlay:
          $ref: "#/components/schemas/RestrictiveOverlay"

    OverlayUpdatedEvent:
      description: |
        CloudEvents 1.0 envelope for an `overlay-updated` notification. The
        `type` is constrained to the single value defined by this API and the
        `data` payload carries the replacement `RestrictiveOverlay` for one
        CAMARA API.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          required:
            - type
            - data
            - datacontenttype
          properties:
            type:
              $ref: "#/components/schemas/OverlayUpdatedEventType"
            data:
              $ref: "#/components/schemas/OverlayUpdatedEventData"

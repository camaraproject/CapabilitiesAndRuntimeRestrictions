openapi: 3.0.3
info:
  title: Effective Capabilities and Restrictions
  description: |
    The Effective Capabilities and Restrictions API lets an API Consumer
    discover, before invocation, the effective capability set that a producer
    supports for one or more released CAMARA APIs — either as static,
    producer-wide constraints or as runtime constraints derived from a specific
    end-user device context.

    ## Definitions

    **Capability**: the set of features, operations, parameters, and value
    ranges that the producer effectively supports for a given API and context.
    Analogous to `supportedFeatures` in 3GPP TS 29.571 — where a feature is
    considered supported if and only if it falls within the declared capability
    set — the effective capability set here is derived by starting from the
    full CAMARA API specification (representing the universe of possible
    features) and subtracting the restrictions enumerated in the returned
    overlay. An element of the CAMARA spec not referenced by any action in
    the overlay is therefore within the producer's capability set and is
    supported with its unmodified, CAMARA-defined semantics.

    **Restriction**: a narrowing of the CAMARA API contract that explicitly
    places a feature or value range *outside* the producer's capability set
    for the given context. Analogous to a cleared bit in a `supportedFeatures`
    bitmap, a restriction is a precise, positive signal of non-support —
    not an inference. Restrictions fall into two categories:

    - *Static* (producer-wide): apply regardless of which device is queried,
      reflecting a deployment policy or network-wide capability boundary.
      Analogous to network-level `supportedFeatures` declared by the serving
      node independently of any individual UE.
    - *Runtime* (device-context): additionally conditioned on a specific
      end-user device's footprint, subscription tier, or current network
      attachment. Analogous to per-UE `supportedFeatures` negotiated at
      session or subscription establishment.

    The overlay therefore functions as an **inverse capability declaration**:
    rather than enumerating what the producer supports (as a `supportedFeatures`
    bitmap would), it enumerates only the deviations from full support. This
    inversion is intentional — most features are supported; only the exceptions
    require enumeration, keeping the overlay compact. The effective capability
    set is the complement: everything the CAMARA spec defines that the overlay
    does not restrict.

    The producer returns, per requested CAMARA API, a `RestrictiveOverlay`
    document that the consumer applies locally to the corresponding CAMARA
    API specification to obtain a strictly-valid, narrowed view representing
    the producer's effective capability set for that context.

    > **Note on Overlay versioning**: this API targets Overlay Specification
    > **version 1.1.0**. Returned overlay documents carry `overlay: "1.1.0"`
    > in their root field, enforced structurally by `RestrictiveOverlay`
    > (see `components/schemas/RestrictiveOverlay`). Consumers MUST NOT assume
    > that [`https://spec.openapis.org/overlay/latest.html`](https://spec.openapis.org/overlay/latest.html)
    > resolves to 1.1.0 — that URL tracks the upstream release train. Adoption
    > of a newer Overlay version would be a breaking change requiring a new API
    > version.

    # Restriction-only semantics

    Producers MUST emit only restrictive `actions[]` in every overlay returned
    by this API. An action is restrictive when it either:

    - sets `remove: true` to delete an existing node from the target document, or
    - sets `update` to a map of named restriction sets. Each set is a
      `SchemaRestrictions` object whose `restrictions[]` narrow the target node
      with `kind`-tagged restrictions — for example, an `enum` listing only
      values the target already admits (a strict subset when the target
      defines an `enum`), a lowered `maximum`/`maxLength`/`maxItems`,
      a raised `minimum`/`minLength`/`minItems`, a tightened `pattern`, a
      `uniqueItems: true` constraint, a `required` array that adds
      previously-optional properties, or a runtime directive such as
      `notAvailable: true` or `presence: false`.

    **Structural enforcement**: restriction-only semantics are enforced at the
    schema level by the `RestrictiveAction` and `SchemaRestrictions` schemas,
    not only by prose contract:

    - `RestrictiveAction` uses `additionalProperties: false` to structurally
      forbid the `copy` action introduced in Overlay 1.1.0. A well-formed
      response document cannot carry `copy` — any such document fails schema
      validation before reaching a consumer.
    - The `update` field in `RestrictiveAction` is typed as a map whose values
      must conform to `SchemaRestrictions`. The `SchemaRestrictions` vocabulary
      is a closed set of narrowing-only keywords. Widening operations — adding
      paths or operations, removing `required` entries, broadening enums —
      have no representation in this vocabulary and therefore cannot appear in
      a valid `update`.
    - `remove` is constrained to `enum: [true]` — only structural removal is
      expressible; `remove: false` (a no-op) is rejected.
    - Two `not` clauses under `allOf` on `RestrictiveAction` enforce that
      exactly one mutating field is present per action; an action with both
      or neither fails validation. The optional, informational `description`
      does not count as a mutating field.

    Each `RestrictiveAction` MUST carry exactly one of `remove: true` or
    `update`. Co-presence of both, or presence of neither, fails schema
    validation (the `not` constraints on `RestrictiveAction`). Unlike raw
    Overlay 1.1.0 — which allows co-presence and resolves it by precedence —
    this API treats co-presence as a producer error, not a tie-break.

    Consumers MUST reject any overlay whose actions broaden the target
    document — for example, actions that add new operations, widen an `enum`,
    introduce new `oneOf` branches, raise a `maximum`, lower a `required`
    array, or otherwise relax the contract of the underlying CAMARA API.

    # Applying a restrictive overlay

    A `RestrictiveOverlay` is not a stock Overlay document: each `update` value
    is a `SchemaRestrictions` object, not a JSON fragment to merge. Do not use
    a generic Overlay processor. An API Consumer applies an overlay as follows.

    **Inputs.** The overlay, and the upstream CAMARA API specification that its
    `extends` URL identifies (the same URL as the entry in `apis[]`, or
    `data.api` in a notification). The effective contract is that specification
    narrowed by the overlay. Anything the overlay does not target is supported
    with its unmodified CAMARA semantics.

    **Steps.**

    1. Check that `overlay` is `"1.1.0"` and that `extends` is one of the
       requested APIs. Reject an overlay that broadens the specification, as
       stated in "Restriction-only semantics".
    2. Process `actions[]` in the order given. Evaluate each `target` as
       described in "Target expressions" below to select nodes. A target that
       selects no node is an error: reject the overlay.
    3. If the action has `remove: true`, treat the selected nodes as absent
       everywhere the application reads them. Removed nodes are also absent
       for the evaluation of every later `target`.
    4. If the action has `update`, apply every named set it contains. The name
       is a label chosen by the producer and has no meaning; read all sets, do
       not look one up by name. In each set, take the subtype of each
       restriction from its `kind` value, and evaluate `restrictions[]` with
       `operator`:
       - `and` (default): every restriction applies.
       - `or`: at least one restriction applies.
       - `not`: the single restriction does not apply. A `not` restriction is
         valid only where it can be shown to narrow the target; reject any
         overlay that carries a `not` restriction you cannot show to narrow.
    5. Combine all restrictions that reach the same node, from any set or
       action: they apply together, and the result is never wider than the
       upstream specification. For `required`, the effective required set is
       the original set plus every name added by a `required` restriction.
    6. When a notification arrives, replace the whole cached overlay for
       `data.api` with `data.overlay` and apply it again. Do not compute
       differences.

    **Target expressions.** Every API Consumer must select the same nodes for
    the same overlay, so targets are evaluated as follows.

    - A `target` is a JSONPath expression as defined by RFC 9535, which
      Overlay 1.1.0 uses. Implementations MUST use an RFC 9535-conformant
      evaluator. Several widely used JSONPath libraries implement earlier
      dialects and evaluate filter selectors differently, in some cases
      returning no node without an error.
    - A `target` is evaluated against the upstream specification exactly as
      published at the `extends` URL. `$ref` is not resolved during
      evaluation: to restrict a schema reached through `$ref`, target the
      referenced component.
    - Only `remove` actions change the document seen by later targets. An
      `update` action attaches restrictions to the selected nodes; it does not
      change the document against which later targets are evaluated.
    - A target that selects several nodes applies to each of them. A
      restriction on a node under `components` applies wherever that node is
      referenced, in requests and in responses.

    API Producers SHOULD write targets as follows, so that targets stay
    readable and keep selecting the intended node across releases of the
    upstream specification:

    - Use name selectors wherever they reach the node, for example
      `$.components.schemas.SinkCredential.properties.credentialType`.
    - Use a filter selector only to cross an array, in the form
      `[?@.<member>]` or `[?@.<member>=='<value>']`, for example
      `$.components.schemas.CreateSession.allOf[?@.properties.duration].properties.duration`.
      To select an array element by the value of `$ref`, write the member
      name in brackets, because `$` cannot start a member-name shorthand:
      `$.components.schemas.AccessDetail.oneOf[?@['$ref']=='#/components/schemas/ThreadTlvAccessDetail']`.
    - Do not use index or slice selectors (such as `allOf[2]`), which select
      by position, or descendant (`..`) and wildcard (`*`) selectors, which
      can select more nodes than intended.
    - Know how many nodes each target selects, normally exactly one, and
      check it before emitting the overlay.

    **Effect of each restriction subtype.** Every restriction object has a
    required `kind` property whose value is the subtype name; it selects the
    row below.

    | Subtype (value of `kind`) | Keywords | Effect for the API Consumer |
    |---|---|---|
    | `SchemaRestrictionAnnotation` | `deprecated`, `readOnly`, `writeOnly` (only `true`), `default` | Mark the field accordingly; `default` is a value to pre-fill and must still be valid for the field. |
    | `SchemaRestrictionAnyInstance` | `type`, `enum`, `const` | `enum`: offer only the listed values and clear a selection that is no longer listed. `const`: the field has one fixed value. `type`: the accepted JSON type has narrowed. |
    | `SchemaRestrictionNumeric` | `maximum`, `minimum`, `exclusiveMaximum`, `exclusiveMinimum`, `multipleOf` | Tighten the bounds or step; bring an entered value into the new range. |
    | `SchemaRestrictionString` | `maxLength`, `minLength`, `pattern` | Tighten the length limits or the pattern check. |
    | `SchemaRestrictionArray` | `maxItems`, `minItems`, `uniqueItems`, `maxContains`, `minContains` | Tighten the item count; with `uniqueItems`, do not allow duplicates. |
    | `SchemaRestrictionObject` | `maxProperties`, `minProperties`, `required`, `dependentRequired`, `excludedProperties` | `required`: the named properties are mandatory. `excludedProperties`: omit these properties from the request body. |
    | `SchemaRestrictionParameter` | `allowEmptyValue` (only `false`), `mandatory` (only `true`) | The parameter can no longer be empty, or is now required. |
    | `SchemaRestrictionOperation` | `notImplemented`, `notAvailable` (only `true`) | Do not call the operation. The operation stays in the document; `notImplemented` and `notAvailable` correspond to `501` and `503` if it is called anyway. |
    | `SchemaRestrictionInstancePresence` | `presence` | Runtime directive about request and response instances: with `false`, omit the field from the outgoing body even though the schema node exists. |

    **Example.** A request for one API, without `sink`, for one device:

    ```json
    {
      "apis": [
        "https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml"
      ],
      "device": { "phoneNumber": "+123456788" }
    }
    ```

    Response `200 OK` (each target selects exactly one node in the referenced
    release of Quality on Demand):

    ```json
    [
      {
        "overlay": "1.1.0",
        "info": { "title": "QoD effective restrictions", "version": "1" },
        "extends": "https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml",
        "actions": [
          {
            "target": "$.components.schemas.SinkCredential.properties.credentialType",
            "description": "Notification sinks accept access-token credentials only",
            "update": {
              "sinkAuth": {
                "targetKind": "schemaProperty",
                "restrictions": [ { "kind": "SchemaRestrictionAnyInstance", "enum": ["ACCESSTOKEN"] } ]
              }
            }
          },
          {
            "target": "$.components.schemas.CreateSession.allOf[?@.properties.duration].properties.duration",
            "description": "Cap the requested session duration at one hour",
            "update": {
              "durationCap": {
                "targetKind": "schemaProperty",
                "restrictions": [ { "kind": "SchemaRestrictionNumeric", "maximum": 3600 } ]
              }
            }
          },
          {
            "target": "$.paths['/sessions/{sessionId}/extend']",
            "description": "Session extension is not offered for this device",
            "remove": true
          }
        ]
      }
    ]
    ```

    Applying it gives the effective contract for this device:

    - `credentialType` in a sink credential accepts only `ACCESSTOKEN`. A
      form for registering a notification sink offers only access-token
      credentials.
    - `duration` in a session creation request is at most 3600. A larger value
      entered by the user is brought down to 3600. The filter selector
      `[?@.properties.duration]` selects the `allOf` branch of `CreateSession`
      that defines `duration`, whatever its position.
    - The `/sessions/{sessionId}/extend` path is treated as absent, so the
      application does not offer that action.

    Each `description` states the producer's intent for a human reader; it
    has no effect on how the action is applied.

    Everything else in the upstream specification is supported unchanged.


    # Operation model

    The single operation `POST /retrieve-effective-overlay` accepts a list of
    CAMARA API specification URLs (released GitHub versions) and an optional
    `device` context. When `device` is supplied, the returned overlay for each
    API reflects the **union of static and runtime restrictions**: static
    restrictions are producer-wide and apply regardless of the device
    supplied; runtime restrictions are additionally conditioned on the
    device's footprint, subscription tier, or network attachment. When
    `device` is omitted, the returned overlay contains **only the static,
    producer-wide restrictions**. The device is never derived from the access
    token. Consumers MUST NOT assume that all restrictions in a returned
    overlay are device-specific — a restriction present regardless of which
    device is queried is a static, producer-wide constraint on the capability
    set.

    The operation has two delivery modes selected by whether the request
    carries a `sink`:

    - **Synchronous** (no `sink`): the producer evaluates the request and
      returns `200 OK` with an array of `RestrictiveOverlay` documents — a
      CAMARA profile of Overlay 1.1.0 restricted to narrowing-only actions —
      one per requested API, in the same order as the request's `apis[]`.
    - **Asynchronous (implicit subscription)** (`sink` present, optionally
      with `sinkCredential`): the producer returns `202 Accepted` immediately with an
      echo of the registered `sink` (never the credential), and delivers each
      computed overlay later via the sink as a single non-batch CloudEvent of
      type
      `org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated`,
      one CloudEvent per requested API. Subsequent producer-side state changes
      (for example, the device moves to a new footprint) result in additional
      CloudEvents of the same type carrying the updated overlay for the
      affected API.

    # End-to-end flow at a glance

    ```text
       App Backend          ECR Producer            Upstream CAMARA
       (Consumer)           (this API)              API (e.g. QoD)
            |                     |                        |
            | (a) [dev-time, one-time] developer or        |
            |     build pipeline fetches the upstream      |
            |     CAMARA spec (e.g. QoD r3.2) and          |
            |     bundles/ships it with the app            |
            |--------------------------------------------->|
            |<---------------------------------------------|
            |                     |                        |
            |    = = = = = = = = = = = = = = = = = =       |
            |             runtime (per device)             |
            |                     |                        |
            | (b) POST /retrieve-effective-overlay         |
            |     { apis:[<qod-url>], device:{...} }       |
            |-------------------->|                        |
            |                     | resolve (device, api): |
            |                     |  producer policy +     |
            |                     |  device footprint      |
            | (c) 200 OK          |                        |
            |     [{ overlay:"1.1.0",                      |
            |        extends:"<qod-url>",                  |
            |        actions:[ remove,                     |
            |                  update{enum},               |
            |                  update{maximum}, ... ] }]   |
            |<--------------------|                        |
            |                     |                        |
            | (d) apply overlay locally to cached spec     |
            |     => effective contract for THIS device    |
            |                     |                        |
            | (e) drive UI; pre-validate request bodies    |
            |     against the effective contract           |
            |                     |                        |
            | (f) POST upstream call (e.g. /sessions),     |
            |     pre-validated vs. the narrowed schema    |
            |--------------------------------------------->|
            |<---------------------------------------------|
            |     200/201 -- no surprise 422s              |
    ```

    If the consumer has no device context, `device` is omitted in step (b);
    the overlay then contains only static restrictions, and steps (d) to (f)
    are unchanged.

    Async variant: if the request body also carries `sink` (and optionally
    `sinkCredential`), step (c) becomes `202 Accepted` (echoing only the
    `sink`) and the producer later POSTs `overlay-updated` CloudEvents to
    the sink — once on the initial evaluation and once on each subsequent
    effective-view change. The consumer replaces its cached overlay for
    `data.api` and re-applies, then re-renders step (e) without
    re-mounting the form.

    # Recovery

    Notification delivery is at-most-once. To recover from a missed
    notification, a consumer re-issues the original
    `POST /retrieve-effective-overlay` request without `sink` (synchronous
    mode): the response always reflects the producer's current effective view
    for the supplied context. There is no bitmap, no `mappingVersion`, no
    resync state machine.

    # Lifetime of asynchronous delivery

    A request with `sink` registers delivery of `overlay-updated` events. There
    is no managed resource: the registration is identified by the API
    Consumer, the `device` (if any), the requested API URL and the `sink`.

    - **Replacement:** a repeated request with the same API Consumer, device,
      API URL and `sink` replaces the earlier registration for that API. The
      lifetime below starts again from the new request. It does not create a
      duplicate registration.
    - **End of delivery:** delivery for a registration ends at the earlier of
      (a) the expiry of the `sinkCredential` access token
      (`accessTokenExpiresUtc`), when the credential type has one, and (b) a
      maximum duration defined by the API provider.
    - **Sink gone:** if the sink responds to a notification with
      `410 GONE`, the API provider ends delivery for that registration.
    - No notification is sent when delivery ends. A consumer that needs to
      keep receiving events re-issues the request before delivery ends.

    # Required scope and sink authentication

    The required scope for the `retrieveEffectiveOverlay` operation is
    `effective-capabilities-and-restrictions:retrieve-effective-overlay`, which
    grants the right to retrieve the effective overlay. Callback (`sink`)
    authentication is conveyed out-of-band by the optional `sinkCredential`
    supplied with the request; it is RECOMMENDED to provide one. The
    credential itself is never echoed in any response.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: wip
  x-camara-commonalities: 0.9.0

externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/CapabilitiesAndRuntimeRestrictions

servers:
  - url: "{apiRoot}/effective-capabilities-and-restrictions/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`

tags:
  - name: Effective Overlay
    description: |
      Retrieve producer-specific effective overlay documents for one or more
      CAMARA APIs, optionally in the context of a given device. Optionally
      subscribe to overlay updates via an implicit `sink` callback.

security:
  - openId:
      - effective-capabilities-and-restrictions:retrieve-effective-overlay

paths:
  /retrieve-effective-overlay:
    post:
      tags:
        - Effective Overlay
      summary: Retrieve the effective overlay for one or more CAMARA APIs
      description: |
        Computes the producer-specific effective overlay for each CAMARA API
        listed in `apis[]`. If `device` is supplied, the overlay includes the
        runtime restrictions for that device; if `device` is omitted, it
        contains only the static, producer-wide restrictions.

        Use this operation when there is a need to retrieve the effective
        overlay for one or more CAMARA APIs.

        - If `sink` is not supplied, returns `200 OK` synchronously with an
          array of `RestrictiveOverlay` documents — a CAMARA profile of
          Overlay 1.1.0 restricted to narrowing-only actions — one per entry
          in `apis[]`, in the same order as the request.
        - If `sink` is supplied (optionally with `sinkCredential`), returns
          `202 Accepted` with no overlays in the body (the response echoes
          only the registered `sink`) and the producer subsequently delivers
          one CloudEvent of type
          `org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated`
          per requested API via the registered `sink`. Additional CloudEvents
          of the same type are delivered whenever the effective overlay for
          any of the requested APIs changes. See the "Lifetime of
          asynchronous delivery" section of the API description for how
          registrations are replaced and when delivery ends.

        If any URL in `apis[]` identifies a CAMARA API specification that the
        API provider does not support, the whole request is rejected with
        `422 EFFECTIVE_CAPABILITIES_AND_RESTRICTIONS.API_NOT_SUPPORTED`; no
        overlay is returned and no delivery is registered.

        If `sink` is provided but the API provider does not support
        notification delivery, the request is rejected with
        `422 EVENT_NOTIFICATIONS_NOT_SUPPORTED` and no delivery is registered.
        The consumer can retry without `sink` to use the synchronous mode.

        Repeating a synchronous request returns the same effective overlay
        set for a stable producer-side configuration.
      operationId: retrieveEffectiveOverlay
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        description: |
          List of CAMARA API specification URLs to evaluate, an optional device
          context, and an optional `sink` (with an optional `sinkCredential`)
          that selects asynchronous delivery.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveEffectiveOverlayRequest"
      callbacks:
        overlayUpdated:
          "{$request.body#/sink}":
            post:
              summary: "overlay-updated notification callback"
              description: |
                Important: this endpoint is to be implemented by the API
                consumer. The Effective Capabilities and Restrictions producer
                POSTs to this endpoint once per affected CAMARA API whenever
                the effective overlay changes for the device-context of an
                active asynchronous request. Each notification is a single
                (non-batch) CloudEvent carrying a `RestrictiveOverlay` document
                in its `data.overlay` field.
              operationId: postOverlayUpdated
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                description: CloudEvent carrying the replacement overlay for one CAMARA API.
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/OverlayUpdatedEvent"
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
                "403":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
                "410":
                  $ref: "../common/CAMARA_event_common.yaml#/components/responses/SinkGone410"
                "429":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        "200":
          description: |
            Synchronous response. The body is an array of `RestrictiveOverlay`
            documents — a CAMARA profile of [OpenAPI Overlay 1.1.0](https://spec.openapis.org/overlay/v1.1.0.html)
            restricted to narrowing-only actions — one per entry in
            the request's `apis[]`, in the same order. Each document carries
            `overlay: "1.1.0"` in its root field, enforced by the
            `RestrictiveOverlay` schema. Returned only when the request
            omits `sink`.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 20
                description: |
                  One `RestrictiveOverlay` document per requested CAMARA API,
                  in the same order as the request's `apis[]`. Each document
                  carries `overlay: "1.1.0"` and contains only narrowing-only
                  actions enforced by the `RestrictiveAction` schema.
                items:
                  $ref: "#/components/schemas/RestrictiveOverlay"
              examples:
                RESTRICTIONS_FOR_DEVICE:
                  summary: Static and runtime restrictions for a device
                  description: |
                    Request with `device` and without `sink`. The overlay for
                    the requested API narrows an enum, caps a numeric value and
                    removes an operation for this device. It repeats the
                    producer-wide restriction on `credentialType` and carries
                    the tighter of the producer-wide and device-specific caps
                    on `duration`.
                  value:
                    - overlay: "1.1.0"
                      info:
                        title: QoD effective restrictions
                        version: "1"
                      extends: https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml
                      actions:
                        - target: "$.components.schemas.SinkCredential.properties.credentialType"
                          description: Notification sinks accept access-token credentials only
                          update:
                            sinkAuth:
                              targetKind: schemaProperty
                              restrictions:
                                - kind: SchemaRestrictionAnyInstance
                                  enum:
                                    - ACCESSTOKEN
                        - target: "$.components.schemas.CreateSession.allOf[?@.properties.duration].properties.duration"
                          description: Cap the requested session duration at one hour
                          update:
                            durationCap:
                              targetKind: schemaProperty
                              restrictions:
                                - kind: SchemaRestrictionNumeric
                                  maximum: 3600
                        - target: "$.paths['/sessions/{sessionId}/extend']"
                          description: Session extension is not offered for this device
                          remove: true
                STATIC_RESTRICTIONS_ONLY:
                  summary: Static, producer-wide restrictions only
                  description: |
                    Request without `device` and without `sink`. The overlay
                    contains only the producer-wide restrictions.
                  value:
                    - overlay: "1.1.0"
                      extends: https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml
                      actions:
                        - target: "$.components.schemas.SinkCredential.properties.credentialType"
                          description: Notification sinks accept access-token credentials only
                          update:
                            sinkAuth:
                              targetKind: schemaProperty
                              restrictions:
                                - kind: SchemaRestrictionAnyInstance
                                  enum:
                                    - ACCESSTOKEN
                        - target: "$.components.schemas.CreateSession.allOf[?@.properties.duration].properties.duration"
                          description: Producer-wide cap on the requested session duration
                          update:
                            durationCap:
                              targetKind: schemaProperty
                              restrictions:
                                - kind: SchemaRestrictionNumeric
                                  maximum: 86400
                FULL_SUPPORT:
                  summary: Full support for this device
                  description: |
                    Request with `device` and without `sink`. No restriction
                    applies: the requested API is supported with unmodified
                    CAMARA semantics for this device. An empty `actions` list
                    is the positive answer; overlays never list what is
                    supported.
                  value:
                    - overlay: "1.1.0"
                      extends: https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml
                      actions: []
        "202":
          description: |
            Asynchronous acceptance. Returned only when `sink` is present in
            the request (`sinkCredential` is optional). No overlays are
            included in the body; the producer will deliver one CloudEvent
            of type
            `org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated`
            per requested API to the registered `sink`. The body echoes only
            the registered `sink` so the consumer can confirm the value the
            producer captured. The `sinkCredential` is never echoed.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveEffectiveOverlayAccepted"
              examples:
                SINK_REGISTERED:
                  summary: Asynchronous delivery accepted
                  description: |
                    Request with `sink`. The response echoes only the
                    registered `sink`; the overlays are delivered later as
                    `overlay-updated` CloudEvents.
                  value:
                    sink: https://app.example.com/effective-overlay/notifications
        # 5xx statuses are not documented by default (Design Guide section 3.2.1 NOTE).
        "400":
          $ref: "#/components/responses/RetrieveEffectiveOverlayBadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/IdentifierNotFound404"
        "422":
          description: Unprocessable Content
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
                  - type: object
                    properties:
                      status:
                        enum:
                          - 422
                      code:
                        enum:
                          - UNSUPPORTED_IDENTIFIER
                          - SERVICE_NOT_APPLICABLE
                          - PRIVATE_KEY_JWT_NOT_CONFIGURED
                          - EVENT_NOTIFICATIONS_NOT_SUPPORTED
                          - EFFECTIVE_CAPABILITIES_AND_RESTRICTIONS.API_NOT_SUPPORTED
              examples:
                GENERIC_422_UNSUPPORTED_IDENTIFIER_DEVICE:
                  $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_UNSUPPORTED_IDENTIFIER_DEVICE"
                GENERIC_422_SERVICE_NOT_APPLICABLE:
                  $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_SERVICE_NOT_APPLICABLE"
                GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED:
                  $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED"
                GENERIC_422_EVENT_NOTIFICATIONS_NOT_SUPPORTED:
                  $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_422_EVENT_NOTIFICATIONS_NOT_SUPPORTED"
                EFFECTIVE_CAPABILITIES_AND_RESTRICTIONS_API_NOT_SUPPORTED:
                  $ref: "#/components/examples/EFFECTIVE_CAPABILITIES_AND_RESTRICTIONS_API_NOT_SUPPORTED"
        "429":
          $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"

  responses:
    RetrieveEffectiveOverlayBadRequest400:
      description: Problem with the client request
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - INVALID_PROTOCOL
                      - INVALID_CREDENTIAL
                      - INVALID_TOKEN
                      - INVALID_SINK
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_400_INVALID_ARGUMENT"
            GENERIC_400_INVALID_PROTOCOL:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_400_INVALID_PROTOCOL"
            GENERIC_400_INVALID_CREDENTIAL:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_400_INVALID_CREDENTIAL"
            GENERIC_400_INVALID_TOKEN:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_400_INVALID_TOKEN"
            GENERIC_400_INVALID_SINK:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_400_INVALID_SINK"

  examples:
    EFFECTIVE_CAPABILITIES_AND_RESTRICTIONS_API_NOT_SUPPORTED:
      summary: Requested CAMARA API not supported
      description: |
        At least one URL in `apis[]` identifies a CAMARA API specification that
        the API provider does not support. The whole request is rejected and
        no overlay is returned.
      value:
        status: 422
        code: EFFECTIVE_CAPABILITIES_AND_RESTRICTIONS.API_NOT_SUPPORTED
        message: At least one of the requested CAMARA API specifications is not supported by this API provider.


  schemas:

    # ─────────────────────────────────────────────────────────────────────────
    # Request body
    # ─────────────────────────────────────────────────────────────────────────

    RetrieveEffectiveOverlayRequest:
      description: |
        Request body for `POST /retrieve-effective-overlay`. Carries the list
        of CAMARA APIs to evaluate, an optional device context, and
        (optionally) an implicit-subscription `sink`, with an optional
        `sinkCredential`, selecting asynchronous delivery.

        If `sink` is present, the request selects asynchronous mode (`202`
        response); if it is absent, synchronous mode (`200` response).
        `sinkCredential` is RECOMMENDED when `sink` is present and is not
        valid without `sink`: a request with `sinkCredential` but no `sink`
        is rejected with `400 INVALID_ARGUMENT`.
      type: object
      required:
        - apis
      properties:
        apis:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: |
            One or more URLs identifying released GitHub versions of CAMARA
            API specifications for which the producer's effective overlay is
            requested. The producer returns one overlay per entry, in the
            same order.
          items:
            type: string
            format: uri
            maxLength: 2048
            description: |
              URL of a released version of a CAMARA API specification on
              GitHub, e.g.
              `https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml`.
              The URL identifies the specification. Consumers and providers
              match it as a string and cannot assume it can be fetched
              directly.
            example: "https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml"
        device:
          description: |
            Optional device context. If supplied, the overlay also contains the
            runtime restrictions that apply to this device. If omitted, only the
            static, producer-wide restrictions are returned. The device is not
            derived from the access token.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        sink:
          description: |
            HTTPS URL at which the API Consumer is willing to receive
            `overlay-updated` CloudEvents. Presence of this property selects
            the asynchronous delivery mode and implicitly subscribes the
            consumer to overlay updates for the requested APIs. If the API
            provider does not support notification delivery, the request is
            rejected with `422 EVENT_NOTIFICATIONS_NOT_SUPPORTED`.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          description: |
            Credential used by the API provider to authenticate when delivering
            events to `sink`. It is RECOMMENDED to provide one.

            For `accessTokenExpiresUtc`: an absolute (UTC) timestamp at which
            the token shall be considered expired. Token expiration SHOULD
            occur after the expiration of the requested registration,
            allowing the client to be notified of any changes during the
            registration's existence. If the token expires while the
            registration is still active, the client will stop receiving
            notifications.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"

    # ─────────────────────────────────────────────────────────────────────────
    # Accepted response (async mode)
    #
    # Echoes only the registered `sink` so the consumer can confirm the value
    # the producer captured. The `sinkCredential` is never echoed.
    # ─────────────────────────────────────────────────────────────────────────

    RetrieveEffectiveOverlayAccepted:
      description: |
        Acknowledges acceptance of an asynchronous request. Echoes only the
        registered `sink`; overlays are delivered later via CloudEvents and
        are not part of this response.
      type: object
      required:
        - sink
      properties:
        sink:
          description: |
            The HTTPS sink URL the producer has registered for this request.
            Echoed verbatim from the request body for consumer confirmation.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"

    # ─────────────────────────────────────────────────────────────────────────
    # SchemaRestrictions vocabulary — defined in shared module
    #
    # All SchemaRestriction* schemas live in the shared module (vocabulary 2.1.0):
    #   ../modules/schema-restrictions.yaml
    #
    # This API references only the root entry point (SchemaRestrictions) via
    # RestrictiveAction.update.additionalProperties. The full vocabulary
    # (SchemaRestriction, SchemaRestrictionAnnotation, SchemaRestrictionAnyInstance,
    # SchemaRestrictionNumeric, SchemaRestrictionString, SchemaRestrictionArray,
    # SchemaRestrictionObject, SchemaRestrictionParameter,
    # SchemaRestrictionOperation, SchemaRestrictionInstancePresence) is defined and
    # documented there. The bundled release artifact inlines all $refs, so
    # consumers always receive a self-contained document.
    #
    # SchemaRestriction uses oneOf (not anyOf) with a required `kind`
    # discriminator: each restriction object carries `kind` set to its
    # subtype's schema name.
    # The module file name is unversioned; its vocabulary version is the
    # module's info.version. A vocabulary change is made in place with an
    # info.version bump (see the module's Versioning section). This API adopts
    # a vocabulary version when it is bundled for release; update the version
    # noted above and bump this API's version field when that happens.
    # ─────────────────────────────────────────────────────────────────────────

    # ─────────────────────────────────────────────────────────────────────────
    # Restrictive Overlay structure
    #
    # RestrictiveAction and RestrictiveOverlay define the wire format for
    # overlay documents returned by this API. RestrictiveOverlay is a CAMARA
    # profile of Overlay 1.1.0: it carries overlay: "1.1.0", extends, and
    # actions, but is not executable by a stock Overlay processor because
    # update values are typed through the SchemaRestrictions vocabulary
    # defined in ../modules/schema-restrictions.yaml.
    # ─────────────────────────────────────────────────────────────────────────

    RestrictiveAction:
      description: |
        A CAMARA profile of an Overlay 1.1.0 Action Object, restricted to narrowing-only operations.

        Structural constraints enforced by this schema:

        - `additionalProperties: false` — structurally forbids the `copy` action
          introduced in Overlay 1.1.0. Any overlay document carrying `copy` on an
          action fails schema validation before reaching a consumer.
        - `update` is typed as a map of `SchemaRestrictions` — a closed vocabulary
          of narrowing-only keywords. Widening operations (adding paths, removing
          required entries, broadening enums) have no representation in this
          vocabulary and therefore cannot appear in a valid `update`.
        - `remove` is constrained to `enum: [true]` — only structural removal is
          expressible; `remove: false` (a no-op) is rejected.
        - `allOf` with two `not` clauses — exactly one mutating field MUST be
          present per action: the first clause rejects an action carrying both
          `remove` and `update`, the second rejects an action carrying neither.
          The optional `description` does not count towards this rule.
        - `description` is informational, as in Overlay 1.1.0; it MUST NOT
          affect how the action is applied.
      type: object
      additionalProperties: false
      required: [target]
      allOf:
        - not:
            required: [remove, update]
        - not:
            allOf:
              - not:
                  required: [remove]
              - not:
                  required: [update]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            A JSONPath expression (RFC 9535) selecting one or more nodes in the
            target OpenAPI document to which this action applies. Evaluated
            against the document as published at `extends`, without resolving
            `$ref`, and with the removals of earlier actions applied. MUST select
            at least one node. See "Target expressions" in the API description
            for the recommended form.
          example: "$.components.schemas.CreateSession.allOf[?@.properties.duration].properties.duration"
        description:
          type: string
          maxLength: 1024
          description: |
            Human-readable intent of this action. Informational only; it MUST
            NOT affect how the action is applied.
          example: Cap the requested session duration at one hour
        remove:
          type: boolean
          enum: [true]
          description: |
            When present (and MUST be `true`), the selected node is removed
            from the target document. Removing a node is always a narrowing
            operation. `remove: false` is not permitted.
        update:
          type: object
          description: |
            A map of named restriction sets to apply to the selected node.
            Every value MUST conform to `SchemaRestrictions`. Only narrowing
            keywords are expressible — widening operations have no
            representation in the `SchemaRestrictions` vocabulary.
          minProperties: 1
          additionalProperties:
            $ref: "../modules/schema-restrictions.yaml#/components/schemas/SchemaRestrictions"

    RestrictiveOverlay:
      description: |
        A CAMARA profile of OpenAPI Overlay 1.1.0. Reuses the Overlay 1.1.0
        document structure and JSONPath targeting — the `overlay` field is
        pinned to `"1.1.0"`, `extends` identifies the target CAMARA API
        specification, and `actions` lists the producer-specific narrowings in
        application order — but is not executable by a stock Overlay 1.1.0
        processor because `update` values are interpreted through the CAMARA
        `SchemaRestrictions` vocabulary, which is outside the Overlay 1.1.0
        specification.

        Structural constraints:

        - `additionalProperties: false` eliminates `copy` and any undocumented
          Overlay fields from valid documents.
        - `overlay: enum: ["1.1.0"]` — the version is pinned at the schema level,
          preventing silent adoption of a newer Overlay version whose semantics
          have not been reviewed for restriction-only compatibility.
        - All `actions` items MUST conform to `RestrictiveAction`, which enforces
          the closed `SchemaRestrictions` vocabulary on `update` and forbids `copy`
          structurally.

        Any element of the target CAMARA API specification not referenced by an
        `action.target` is supported by the producer with unmodified semantics.
        The overlay enumerates only producer-specific narrowings; consumers infer
        capabilities from what the overlay leaves untouched.
      type: object
      required: [overlay, extends, actions]
      additionalProperties: false
      properties:
        overlay:
          type: string
          enum: ["1.1.0"]
          maxLength: 10
          description: |
            Overlay specification version. MUST be `"1.1.0"`. Pinned at the
            schema level to prevent silent adoption of a newer Overlay version
            whose semantics have not been reviewed for restriction-only
            compatibility.
        info:
          type: object
          description: Optional metadata about this overlay document.
          additionalProperties: false
          properties:
            title:
              type: string
              maxLength: 256
              description: Human-readable title of the overlay document.
            version:
              type: string
              maxLength: 64
              description: Version of this overlay document.
        extends:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL of the CAMARA API specification this overlay targets. Matches
            one of the entries in the original request's `apis[]`.
          example: "https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml"
        actions:
          type: array
          description: |
            Ordered list of narrowing-only actions to apply to the target
            document. Applied in order. Only `remove` changes the document
            against which later targets are evaluated; `update` attaches
            restrictions and does not. All items MUST conform to
            `RestrictiveAction`.
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/RestrictiveAction"

    # ─────────────────────────────────────────────────────────────────────────
    # CloudEvent notification
    # ─────────────────────────────────────────────────────────────────────────

    OverlayUpdatedEventType:
      type: string
      description: |
        The single CloudEvent type emitted by this API. One CloudEvent is
        delivered per affected CAMARA API.
      enum:
        - org.camaraproject.effective-capabilities-and-restrictions.v0.overlay-updated

    OverlayUpdatedEventData:
      description: |
        Payload of an `overlay-updated` CloudEvent. Identifies the CAMARA API
        whose effective overlay has changed and carries the full replacement
        `RestrictiveOverlay` document. Consumers replace any prior overlay for
        `api` with `overlay`.
      type: object
      required:
        - api
        - overlay
      properties:
        api:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL of the CAMARA API specification whose effective overlay has
            changed. Matches one of the entries in the original request's
            `apis[]`.
          example: "https://github.com/camaraproject/QualityOnDemand/blob/r3.2/code/API_definitions/quality-on-demand.yaml"
        overlay:
          $ref: "#/components/schemas/RestrictiveOverlay"

    OverlayUpdatedEvent:
      description: |
        CloudEvents 1.0 envelope for an `overlay-updated` notification. The
        `type` is constrained to the single value defined by this API and the
        `data` payload carries the replacement `RestrictiveOverlay` for one
        CAMARA API.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              $ref: "#/components/schemas/OverlayUpdatedEventType"
            data:
              $ref: "#/components/schemas/OverlayUpdatedEventData"
